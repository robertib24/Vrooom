<div 
  class="map-container" 
  #mapContainer
  [class.loading]="!googleMapsLoaded"
  [style.height]="height"
  [style.width]="width">
  @if (!googleMapsLoaded) {
    <div class="loading-spinner">
      <img src="assets/images/map-loading.svg" alt="Loading map..." width="48" height="48">
      <p>Loading map...</p>
    </div>
  }
</div>
